<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My YouTube</title>

    <style>
        * {
            margin: 0%;
            padding: 0%;
        }

        #head {
            background-color: rgb(247, 244, 240);
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }

        h3 {
            color: red;
            font-size: 20px;

        }

        #div1 input {
            height: 45px;
            width: 300px;
            padding: 0 15px;
            border: solid 2px rgb(248, 211, 162);
            border-radius: 20px;

        }

        #y {
            width: 40px;
            height: 40px;
            background-color: #777;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* MAIN SECTION */

        #main {
            display: flex;
        }

        #sidebar {
            width: 180px;
            min-height: calc(100vh - 70px);
            padding: 20px 15px;
            background-color: rgb(248, 234, 220);
        }

        #sidebar p {
            padding: 10px;
            margin-bottom: 5px;
            cursor: pointer;
        }

        #sidebar p:hover {
            background-color: #eee;
            border-radius: 8px;
        }


        /* VIDEO SECTION */

        #videos {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px 15px;
            padding: 20px;
            align-content: start;
        }

        .thumbniail {
            width: 100%;
            height: 150px;
            background-color: #ddd;
            border-radius: 5px;
        }

        .video-card {
            cursor: pointer;
        }



        .video-title {
            margin-top: 8px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header id="head">
        <h3>My YouTube</h3>

        <div id="div1">
            <input type="text" placeholder="Search">
        </div>

        <div id="y">Y</div>
    </header>


    <div id="main">
        <aside id="sidebar">
            <p>Home</p>
            <p>Trending</p>
            <p>SUBscrations</p>
            <p>Library</p>
            <p>histery</p>
            <p>watch later</p>
        </aside>

        <section id="videos">
            <div class="video-card">
                <div class="thumbniail"></div>
                <p class="video-title"> Video Title 1</p>
            </div>


            <div class="video-card">
                <div class="thumbniail"></div>
                <p class="video-title"> Video Title 1</p>
            </div>

            <div class="video-card">
                <div class="thumbniail"></div>
                <p class="video-title"> Video Title 2</p>
            </div>


            <div class="video-card">
                <div class="thumbniail"></div>
                <p class="video-title"> Video Title 3</p>
            </div>


            <div class="video-card">
                <div class="thumbniail"></div>
                <p class="video-title"> Video Title 4</p>
            </div>


            <div class="video-card">
                <div class="thumbniail"></div>
                <p class="video-title"> Video Title 5</p>
            </div>


            <div class="video-card">
                <div class="thumbniail"></div>
                <p class="video-title"> Video Title 6</p>
            </div>



        </section>
    </div>

</body>

</html>
