<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            background-color: #ecf9bc;
            height: 60px;
        }

        h2 {
            color: red;
            padding-top: 20px;
            padding-left: 20px;
        }

        #div1 {
            /* width:100px; */
            padding-top: 20px;
            height: 12px;
            align-items: center;


        }

        #div1 input {
            height: 25px;
            width: 260px;
            border-radius: 20px;
        }

        #y {
            height: 40px;
            width: 40px;
            border-radius: 50%;
            padding-right:20px 20px 20px 20px ;

            background-color: rgb(240, 230, 230);

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
        }
    </style>
</head>

<body>
    <header>
        <h2> My YouTube</h2>

        <div id="div1">
            <input type="text" placeholder="Search" requierd>
        </div>

        <div id="y">
            <h2>Y</h2>
        </div>
    </header>
</body>

</html>
