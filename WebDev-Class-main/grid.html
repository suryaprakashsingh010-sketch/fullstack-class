<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        main{
            height: 100vh;
            width: 100vw;
            display: grid;
            grid-template-columns: 1fr 5fr 1fr;
            grid-template-rows: 1fr 5fr;
            grid-template-areas: 
            "header header header"
            "sidebar main secsidebar";
            
        }
        .c1{
            grid-area: sidebar;
            background-color: aqua;
        }
        .c2{
            grid-area: header;
            background-color: black;
        }
        .c3{
            grid-area: main;
            background-color: yellowgreen;
        }
        .c4{
            grid-area: secsidebar;
            background-color: blue;
        }
    </style>
</head>
<body>
    <main>
        <div class="c1"></div>
        <div class="c2"></div>
        <div class="c3"></div>
        <div class="c4"></div>
    </main>
</body>
</html>
